name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh-keyscan -p 2222 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publish built site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: holu
        run: rsync -az --delete -e "ssh -p 2222" dist/ "$VPS_USER@$VPS_HOST:/var/www/sectional-appendix/"
